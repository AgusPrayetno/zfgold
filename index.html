<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ZF.GOLD — Sistem Reseller & Peleburan Emas</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #f8fafc;
      z-index: 10;
      transition: opacity 0.3s ease;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(245, 158, 11, 0.25);
      border-top-color: #f59e0b;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    iframe {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Layar Loading Awal -->
  <div id="loader">
    <div class="spinner"></div>
    <div style="font-weight: 700; font-size: 16px; letter-spacing: 0.5px;">ZF<span style="color: #f59e0b;">.GOLD</span></div>
    <div style="font-size: 12px; color: #94a3b8; margin-top: 4px;">Memuat aplikasi...</div>
  </div>

  <!-- Frame Utama Google Apps Script -->
  <iframe 
    id="app-frame"
    src="https://script.google.com/macros/s/AKfycbyExUWDFm85wdcNhH2AoGA2Ej3l9q86yf6QI4ubEvx6pfCVqxlW3WYyIh4-xxOWDeSXyw/exec"
    allow="clipboard-read; clipboard-write"
    onload="document.getElementById('loader').style.opacity='0'; setTimeout(() => document.getElementById('loader').style.display='none', 300);">
  </iframe>

</body>
</html>
